<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Brighton Train Departures</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #board {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            background: #000;
        }

        /*
          Swipe zones cover only the outer edges.
          The centre of the TIGER page remains interactive.
        */
        .swipe-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 8%;
            min-width: 50px;
            max-width: 90px;
            z-index: 10;
            background: transparent;
            touch-action: none;
            cursor: grab;
            -webkit-tap-highlight-color: transparent;
        }

        .swipe-zone:active {
            cursor: grabbing;
        }

        #leftZone {
            left: 0;
        }

        #rightZone {
            right: 0;
        }

        /*
          Subtle edge arrows appear briefly when the edge
          is touched. They are hidden at other times.
        */
        .edge-arrow {
            position: absolute;
            top: 50%;
            color: rgba(255, 255, 255, 0.9);
            font-family: Arial, sans-serif;
            font-size: 42px;
            line-height: 1;
            text-shadow: 0 1px 5px #000;
            transform: translateY(-50%);
            opacity: 0;
            transition: opacity 0.15s ease;
            pointer-events: none;
        }

        #leftZone .edge-arrow {
            left: 12px;
        }

        #rightZone .edge-arrow {
            right: 12px;
        }

        .swipe-zone.active .edge-arrow {
            opacity: 1;
        }

        /*
          Board indicator shown briefly after switching.
        */
        #indicator {
            position: fixed;
            left: 50%;
            bottom: 18px;
            z-index: 20;
            display: flex;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.55);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        #indicator.visible {
            opacity: 1;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
        }

        .dot.active {
            background: #fff;
        }

        /*
          Board name shown briefly after switching.
        */
        #boardLabel {
            position: fixed;
            top: 12px;
            left: 50%;
            z-index: 20;
            padding: 7px 12px;
            border-radius: 6px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            font-family: Arial, sans-serif;
            font-size: 14px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        #boardLabel.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <iframe
        id="board"
        title="Brighton train departures"
    ></iframe>

    <div
        id="leftZone"
        class="swipe-zone"
        aria-label="Swipe right or tap to show the previous board"
    >
        <span class="edge-arrow">‹</span>
    </div>

    <div
        id="rightZone"
        class="swipe-zone"
        aria-label="Swipe left or tap to show the next board"
    >
        <span class="edge-arrow">›</span>
    </div>

    <div id="boardLabel" aria-hidden="true"></div>

    <div id="indicator" aria-hidden="true">
        <span class="dot active"></span>
        <span class="dot"></span>
    </div>

    <script>
        "use strict";

        const pages = [
            {
                name: "Brighton",
                url: "https://tiger.worldline.global/BRGHTN/ciss;graphic=1"
            },
            {
                name: "Brighton Lovers Walk",
                url: "https://tiger.worldline.global/BRGHLRD/ciss;graphic=1"
            }
        ];

        // Automatically change after 20 seconds.
        const switchDelay = 20000;

        // Minimum horizontal distance required for a swipe.
        const swipeThreshold = 45;

        // Tap must move less than this distance.
        const tapThreshold = 12;

        let currentPage = 0;
        let switchTimer = null;
        let messageTimer = null;

        const board = document.getElementById("board");
        const leftZone = document.getElementById("leftZone");
        const rightZone = document.getElementById("rightZone");
        const indicator = document.getElementById("indicator");
        const boardLabel = document.getElementById("boardLabel");
        const dots = document.querySelectorAll(".dot");


        function loadPage(index, showMessage = true) {
            currentPage =
                (index + pages.length) % pages.length;

            board.src = pages[currentPage].url;

            updateIndicator();

            if (showMessage) {
                displayBoardMessage();
            }
        }


        function showNextPage() {
            loadPage(currentPage + 1);
            resetTimer();
        }


        function showPreviousPage() {
            loadPage(currentPage - 1);
            resetTimer();
        }


        function resetTimer() {
            clearTimeout(switchTimer);

            switchTimer = setTimeout(function () {
                showNextPage();
            }, switchDelay);
        }


        function updateIndicator() {
            dots.forEach(function (dot, index) {
                dot.classList.toggle(
                    "active",
                    index === currentPage
                );
            });
        }


        function displayBoardMessage() {
            clearTimeout(messageTimer);

            boardLabel.textContent = pages[currentPage].name;

            indicator.classList.add("visible");
            boardLabel.classList.add("visible");

            messageTimer = setTimeout(function () {
                indicator.classList.remove("visible");
                boardLabel.classList.remove("visible");
            }, 1500);
        }


        /*
          Add pointer controls to one of the edge zones.
        */
        function configureSwipeZone(zone, side) {
            let pointerActive = false;
            let startX = 0;
            let startY = 0;

            zone.addEventListener(
                "pointerdown",
                function (event) {
                    pointerActive = true;

                    startX = event.clientX;
                    startY = event.clientY;

                    zone.classList.add("active");
                    zone.setPointerCapture(event.pointerId);

                    resetTimer();
                }
            );


            zone.addEventListener(
                "pointerup",
                function (event) {
                    if (!pointerActive) {
                        return;
                    }

                    pointerActive = false;
                    zone.classList.remove("active");

                    const distanceX = event.clientX - startX;
                    const distanceY = event.clientY - startY;

                    const horizontalDistance =
                        Math.abs(distanceX);

                    const verticalDistance =
                        Math.abs(distanceY);

                    const isHorizontalSwipe =
                        horizontalDistance >= swipeThreshold &&
                        horizontalDistance > verticalDistance;

                    const isTap =
                        horizontalDistance <= tapThreshold &&
                        verticalDistance <= tapThreshold;

                    if (isHorizontalSwipe) {
                        if (distanceX < 0) {
                            showNextPage();
                        } else {
                            showPreviousPage();
                        }

                        return;
                    }

                    /*
                      A tap on the left edge shows the previous
                      board; a tap on the right shows the next.
                    */
                    if (isTap) {
                        if (side === "left") {
                            showPreviousPage();
                        } else {
                            showNextPage();
                        }

                        return;
                    }

                    resetTimer();
                }
            );


            zone.addEventListener(
                "pointercancel",
                function () {
                    pointerActive = false;
                    zone.classList.remove("active");
                    resetTimer();
                }
            );


            zone.addEventListener(
                "contextmenu",
                function (event) {
                    event.preventDefault();
                }
            );
        }


        configureSwipeZone(leftZone, "left");
        configureSwipeZone(rightZone, "right");


        /*
          Arrow keys for testing on a PC.
        */
        window.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "ArrowRight") {
                    event.preventDefault();
                    showNextPage();
                    return;
                }

                if (event.key === "ArrowLeft") {
                    event.preventDefault();
                    showPreviousPage();
                    return;
                }

                resetTimer();
            }
        );


        /*
          Start on the first board.
        */
        loadPage(0, false);
        resetTimer();
    </script>

</body>
</html>
